name: Quality Checks

# Runs on main and pull requests only; dev branches are checked locally before pushing
# (uv run pytest -m "not integration" and uv run --group docs mkdocs build --strict).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install package + test extras (locked)
        run: uv sync --locked --extra mcp --extra dataframe --group dev

      - name: Run unit/offline tests
        run: uv run --no-sync pytest -m "not integration"

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true

      # docs tools come from uv.lock, so CI builds with the same versions as a local build
      - name: Install docs dependencies (locked)
        run: uv sync --locked --extra dataframe --group docs --no-default-groups

      - name: Build docs (strict)
        run: uv run --no-sync mkdocs build --strict
